[package]
name = "blade-volume-convert"
version = "0.1.0"
edition = "2021"
description = "Offline glTF to point-cloud conversion for blade-volume"
license.workspace = true
repository.workspace = true

[dependencies]
blade-volume = { path = "../blade-volume" }
glam.workspace = true
gltf = { version = "1", features = ["import", "KHR_texture_transform"] }
rand = "0.10"

[[bin]]
name = "convert"
path = "src/main.rs"

[lints]
workspace = true
