name: check

on:
  push:
    branches: ["main"]
    tags: ["v0.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      BLADE_VOLUME_DISABLE_GPU: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test default features
        run: cargo +stable test --workspace
      - name: Test all features
        run: cargo +stable test --workspace --all-features

  convert:
    name: Asset conversion
    runs-on: ubuntu-latest
    env:
      BLADE_VOLUME_DISABLE_GPU: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      # The offline glTF path is the front door of the pipeline, so the shipped
      # binary is exercised end to end, not just the library behind it. Both
      # feature configurations are covered: the default pure-Rust Delaunay and
      # the Qhull backend used for asset-sized clouds.
      - name: Build converter (default features)
        run: cargo +stable build --release -p blade-volume-convert
      - name: Smoke test converter (default features)
        run: etc/convert_smoke.sh
      - name: Build converter (qhull)
        run: cargo +stable build --release -p blade-volume-convert --features qhull
      - name: Smoke test converter (qhull)
        run: etc/convert_smoke.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Run rustfmt
        run: cargo +stable fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Run clippy
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

  security:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # quick-xml is build-only through wayland-scanner 0.31.10. Remove
          # these exceptions as soon as wayland-scanner adopts quick-xml 0.41.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
