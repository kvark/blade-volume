schema = 1
name = "bonsai-radfoam-batch1024-optimizer-v1"
purpose = "Test RadFoam optimizer controls at batch 1024 and separate update-indexed from ray-normalized schedules"
dataset = "Mip-NeRF 360 / bonsai"
dataset_path = "etc/data/bonsai-full"
dataset_source = "https://huggingface.co/datasets/nvs-bench/mipnerf360"
dataset_revision = "2e0758f7f5d2bf82d5a29c795d3cbfb64af35474"
dataset_image_files = 292
colmap_registered_images = 292
comparison_scope = "same 512000 sampled training rays; update-indexed arms compare optimizer semantics, ray-normalized arm compares batch direction"

[split]
protocol = "existence-filtered COLMAP order, every Nth held out"
test_every = 8
max_train_views = 255
max_test_views = 8

[model]
backend = "radfoam"
initial_points = 50000
initialization = "radfoam-v1"
target_points = 200000
adjacency = "qhull-delaunay-exact"
sh_degree = 3
densify_fraction = 0.15
prune = true

[training]
width = 128
height = 128
pixel_batch = 1024
completed_steps = 500
sampled_rays = 512000
learning_rate = 0.1
color_loss = "l1"
max_steps = 256
far_plane = 100.0
background = "black"
opacity_weight = 1.0
distortion_weight = 0.0
quantile_weight = 0.0001
softplus_beta = 10.0
sampling_seed = "0xDEAD_BEEF_F00D_CAFE"
densification_seed = "0xCAFE_F00D_DEAD_BEEF"

[contribution]
views = 255
resolution_scale = 2
rays = 1044480
sampling_phase = "absolute densification round 0"

[update_indexed]
steps_per_view = 80
total_steps = 20400
geometry_rebuild_every = 100
geometry_rebuild_schedule = "fixed"
densify_every = 500
densify_warmup = 500
densify_until = 11000
note = "Tests optimizer controls at a larger batch while preserving their update-indexed definitions"

[update_indexed.legacy]
lr_schedule = "cosine"
lr_groups = "legacy"
position_lr_ratio = 0.01

[update_indexed.exact]
lr_schedule = "radfoam-v1"
lr_groups = "absolute reference schedules"

[update_indexed.relative]
lr_schedule = "cosine"
lr_groups = "radfoam-v1-relative"

[ray_normalized]
steps_per_view = 20
total_steps = 5100
geometry_rebuild_every = 25
geometry_rebuild_schedule = "fixed"
densify_every = 125
densify_warmup = 500
densify_until = 2750
lr_schedule = "cosine"
lr_groups = "legacy"
position_lr_ratio = 0.01
note = "Scales update-indexed horizons and topology cadence by four to match batch-256 progress per sampled ray"

[execution]
release_binary_prebuilt = true
memory_max_bytes = 4294967296
memory_swap_max_bytes = 0

[result]
status = "completed"
required = ["git_commit", "gpu", "driver", "wall_seconds", "cells", "train_psnr", "test_psnr"]
