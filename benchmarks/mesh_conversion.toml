# Offline glTF -> point cloud conversion.
#
# Unlike the reconstruction manifests in this directory, this one records
# *cost and structure*, not quality: there is currently no metric comparing a
# converted cloud against its source mesh. Numbers here therefore bound
# usability (can an asset be converted at all, and how fast) and must not be
# read as evidence that any sampling option improves appearance.
#
# Reproduce with:
#   cargo build --release -p blade-volume-convert --features qhull
#   ./target/release/convert blade-volume-test/data/police.glb \
#       -k radfoam -r <resolution> -t <exact|qhull> -o /tmp/foam.ply
#
# The converter uses fixed seeds, so a given commit and flag set reproduces
# byte-identical output; `etc/convert_smoke.sh` asserts that in CI.

[manifest]
name = "mesh_conversion"
asset = "blade-volume-test/data/police.glb"
triangles = 2076
git_commit = "b096da03e3b3fa70512b6fa9395422cf46079726"
cpu = "12th Gen Intel(R) Core(TM) i5-12400F"
threads = 1
profile = "release"
quality_metric = "rendered-image PSNR against the ray-traced source mesh (convert_quality)"

# The interior even-odd test used to scan every triangle for every grid point.
# Indexing it per parity direction (exact narrowing, identical classification)
# removed what was 99.3% of conversion time.
[interior_index]
status = "complete"
before_seconds = 42.6
after_seconds = 0.087
resolution = 128
points = 804464
speedup = 490.0
equivalence = "point counts identical at resolutions 64/96/128; unit test asserts agreement with an exhaustive scan over a 24^3 sweep"

# An exact lattice is cospherical, so its Delaunay triangulation is not unique.
# Both builders were doing more work and returning different answers.
[interior_jitter]
status = "complete"
resolution = 128
default_before = 0.0
default_after = "0.5 for radfoam, 0.0 for gaussian"
default_scope = "per output kind: gaussian builds no adjacency, so jitter buys nothing there and costs 2.3 dB on the reference render"
exact_seconds_before = 30.9
exact_seconds_after = 8.4
exact_speedup = 3.7
qhull_seconds_before = 26.4
qhull_seconds_after = 18.4
edge_disagreement_before = 0.156
edge_disagreement_after = 0.039
selection = "jitter on by default; it is faster and less ambiguous on both builders"

# Sampling alone, with adjacency skipped (--kind gaussian). Linear in points.
[[sampling]]
resolution = 64
points = 104942
seconds = 0.014

[[sampling]]
resolution = 128
points = 804464
seconds = 0.094

[[sampling]]
resolution = 192
points = 2570364
seconds = 0.270

# End-to-end RadFoam, i.e. sampling plus Delaunay. Delaunay is now the whole
# cost, so it is where any further scaling work belongs.
[[radfoam.exact]]
resolution = 32
points = 14784
edges = 226278
seconds = 0.144

[[radfoam.exact]]
resolution = 64
points = 104942
edges = 1619472
seconds = 1.019

[[radfoam.exact]]
resolution = 96
points = 339518
edges = 5252506
seconds = 3.452

[[radfoam.exact]]
resolution = 128
points = 804464
edges = 12468098
seconds = 8.402

[[radfoam.qhull]]
resolution = 32
points = 14784
edges = 232636
seconds = 0.257

[[radfoam.qhull]]
resolution = 64
points = 104942
edges = 1681350
seconds = 2.220

[[radfoam.qhull]]
resolution = 96
points = 339518
edges = 5458440
seconds = 7.580

[[radfoam.qhull]]
resolution = 128
points = 804464
edges = 12955536
seconds = 18.504

[topology_gate]
# Reverses a standing assumption in docs/MESH_TO_FOAM.md, which treated Qhull
# as the escape hatch for asset-sized clouds.
finding = "with the lattice degeneracy removed, the pure-Rust exact builder is 2.2x faster than Qhull at every measured size"
exact_vs_qhull_ratio_at_128 = 2.2
site_counts = "identical for both backends; only the adjacency differs"
selection = "exact remains the default; qhull stays available behind --features qhull for cross-checking"
caveat = "measured on one 2,076-triangle asset up to 804k sites; the crossover on larger or differently distributed inputs is untested"

# ---------------------------------------------------------------------------
# Rendered-image quality.
#
# The reference is the source triangle mesh itself, ray traced through Blade's
# acceleration structures by `MeshReferenceTracer` — not an approximation. The
# candidate is the converted cloud through the ordinary viewer backend. Same
# camera convention, same output format, same shading model, so the difference
# is the representation.
#
#   cargo run --release -p blade-volume-test --bin convert_quality -- \
#       --kind gaussian --resolutions 16,24,32,48,64 --views 8 --size 256
[quality]
reference = "MeshReferenceTracer, hardware ray tracing of the glTF triangles"
views = 8
render_size = 256
metric = "PSNR over RGB, composited on black"

# Monotone and still climbing: the metric responds to sampling rate as a
# quality metric should.
[[quality.gaussian]]
resolution = 16
points = 3376
psnr = 14.04
worst_view_psnr = 13.50

[[quality.gaussian]]
resolution = 24
points = 7049
psnr = 16.38
worst_view_psnr = 15.86

[[quality.gaussian]]
resolution = 32
points = 14784
psnr = 17.87
worst_view_psnr = 17.48

[[quality.gaussian]]
resolution = 48
points = 42728
psnr = 19.83
worst_view_psnr = 19.18

[[quality.gaussian]]
resolution = 64
points = 104942
psnr = 20.77
worst_view_psnr = 20.35

# RadFoam was unrenderable from an external camera before the exterior fill;
# these are with it, at the selected 0.1 rate and 4 views.
[[quality.radfoam]]
resolution = 24
points = 9435
psnr = 12.19

[[quality.radfoam]]
resolution = 48
points = 62538
psnr = 12.63

[[quality.radfoam]]
resolution = 64
points = 152104
psnr = 12.92

[[quality.radfoam]]
resolution = 96
points = 494475
psnr = 12.85

# Two representation bugs the metric exposed immediately. Neither was visible
# to any structural check, which is why cost-only benchmarking had missed them.
[quality.exterior_fog_defect]
status = "fixed"
symptom = "object-centric RadFoam rendered as an opaque white smear from any external camera; PSNR ~5 dB and flat or declining with resolution"
cause = "a Voronoi diagram built only from surface and interior sites gives every point of empty space to an unbounded cell owned by an opaque surface site"
why_training_never_saw_it = "optimisation drives background cells to near-zero density; a converted asset has no such stage"
fix = "ConvertOptions::exterior_density_scale seeds zero-density cells in padded space outside the mesh"
psnr_before = 5.01
psnr_after = 13.90
note = "before/after at resolution 48, 8 views, at the original sparse 0.002 fill"

[quality.density_semantics_defect]
status = "fixed"
symptom = "converted RadFoam objects were washed out, and coverage depended on the sampling rate"
cause = "point.w is alpha for Gaussian splatting but a density per unit length for RadFoam, which integrates alpha = 1 - exp(-w*dt); the converter stored the same number for both, so cells grew more transparent as they shrank"
fix = "stored_density() solves for the density achieving the requested opacity across one local cell"
caveat = "this LOWERED measured PSNR at resolution 48 (13.90 -> 10.27 at the sparse fill) because it stops translucency from masking silhouette bloat; the fix is dimensionally correct and the bloat is addressed by a denser exterior fill"

[quality.exterior_fill_gate]
interval = "resolution 48, 4 views"
rates = [0.002, 0.02, 0.1, 0.5, 1.0]
psnr = [10.38, 12.06, 12.63, 13.00, 13.11]
points = [43092, 46808, 62538, 139338, 240394]
selection = "0.1 — the knee; beyond it point count grows far faster than the image improves"

[quality.backend_selection]
selected = "gaussian"
rationale = "20.77 dB and still climbing with sampling rate, versus a ~13 dB RadFoam plateau at comparable point counts; splatting also has no analogue of the exterior-fog or density-semantics failure modes, since a splat carries its own finite support and alpha"
scope = "the offline conversion path for the first interactive prototype; the trained-from-photographs track stays on RadFoam, where optimisation supplies the learned background density and per-cell opacity that conversion cannot"
revisit_when = "surface sample distribution improves, since that is what the RadFoam ceiling is made of"

[quality.open_gap]
finding = "RadFoam saturates near 13 dB while Gaussian climbs past 20 dB at comparable point counts"
evidence = "RadFoam gains only +0.66 dB from resolution 24 to 96 (12.19 -> 12.85) while quadrupling points; Gaussian gains +6.73 dB over 16 -> 64"
diagnosis = "residual error is surface speckle, not silhouette or transparency: random barycentric samples give an incoherent set of opaque cells rather than a coherent surface"
next = "surface-aware sample distribution (blue noise or a true bounded CVT) is now testable against this metric rather than argued from first principles"

# Scored against blade's canonical path tracer on the same glTF, six views of
# police.glb under five environments, linear-radiance PSNR against a peak of
# one. Reference generated by blade's `relight_data` with RELIGHT_ASSET; the
# framing comes from `asset_bounds`, so both sides see the same thing.
[relight_quality]
harness = "blade-volume-train/src/bin/relight_quality.rs"
asset = "police.glb"
views = 6
environments = 5
size = "320x240"

# More surfels barely move it. Five times the count buys a seventh of a
# decibel, so at this level the gap to a path traced reference is the shading
# model - direct light only, split sum, nine coefficients of irradiance - and
# not the discretisation. Spending on density here would be spending on the
# wrong thing.
[[relight_quality.density]]
resolution = 400
surfels = 235474
psnr = 25.29
render_ms_direct = 0.6

[[relight_quality.density]]
resolution = 900
surfels = 1187562
psnr = 25.44
render_ms_direct = 0.9

# Sixteen and sixty-four rays give the same number to two decimals, which no
# honest stochastic estimator does: the environment is sampled by the cosine
# alone, so a sun a few degrees across is missed by almost every ray and both
# counts are equally wrong. Against a uniform environment the sampled and
# analytic paths agree; against `sun-east` the sampled one is 12 % dark.
[relight_quality.sampling]
analytic_psnr = 25.29
sampled_16_psnr = 25.09
sampled_64_psnr = 25.09
render_ms_16 = 5.4
render_ms_64 = 19.9
verdict = "analytic is better until the environment is importance sampled"

# It was, and it is still not enough. The environment now has an alias table
# built over it and half the rays are drawn from it, weighted against the
# cosine half by the balance heuristic. The table is checked three ways: drawn
# frequencies match its own probabilities, the density integrates to one over
# the sphere, and an isolated surfel with nothing to shadow it lands on the
# analytic irradiance within three percent.
#
# Sixteen and sixty-four rays still agree, but for the opposite reason: before
# they were equally wrong, and now they are equally converged. What is left is
# bias rather than noise, and it is the shading model — one bounce against the
# reference's four, on a closed asset where a car's own panels are most of what
# a ray meets. Direct light alone remains the better trade at a seventh of the
# cost.
[relight_quality.importance_sampling]
analytic_psnr = 27.95
analytic_tonemapped = 23.78
sampled_16_psnr = 27.34
sampled_16_tonemapped = 21.74
sampled_64_tonemapped = 21.74
render_ms_analytic = 0.7
render_ms_16 = 5.3
verdict = "correct, validated, and still not worth its cost with one bounce"

# The same under-sampling, one stage earlier. Prefiltering the environment for
# the specular lobe drew 128 GGX samples per texel, and a broad lobe drawing
# 128 samples misses a sun covering under a thousandth of the sphere almost
# every time - which is most of that environment's energy discarded.
#
# The fix is not more samples at full resolution: a rough level is smooth by
# construction, so it is computed at a reduced size with a far larger budget
# per texel and stretched back up. That is both better and eight times cheaper
# than brute force, because nothing is lost that was ever there.
#
# The environments with a concentrated source gain four to six decibels and the
# broad ones do not move at all, which is the control.
[relight_quality.prefilter]
before_samples = 128
after_samples = 4096
after_computes_rough_levels_reduced = true
psnr_before = 25.29
psnr_after = 27.95
tonemapped_after = 23.78
sun_east_before = 27.88
sun_east_after = 32.71
uniform_before = 23.36
uniform_after = 23.36
prefilter_seconds_before = 7.9
prefilter_seconds_brute_force = 113.9
prefilter_seconds_after = 13.1

# The `studio` outlier was the measure rather than the renderer. That view has
# the light source in frame: two percent of its pixels are above one and it
# peaks at 5.6, while the view scoring 24 dB peaks at 0.2. Squared error
# against a fixed peak of one lets a handful of very bright pixels outweigh
# every other pixel in the image, so the tool now reports a tone mapped score
# beside the linear one and that view reads 20.5 rather than 10.7.
#
# Ruled out along the way, none of them the cause: the stochastic sampling (it
# is there with zero rays), the diffuse basis (nine coefficients match direct
# integration within 5 %), and the surfel density (it survives five times as
# many).
[relight_quality.metric]
linear_psnr_is_dominated_by_highlights = true
studio_worst_linear = 10.69
studio_worst_tonemapped = 20.53
reference_peak_worst_view = 5.6
reference_peak_best_view = 0.2

# A file format for converted surfels, so an asset is converted once and read
# after that. The claim it has to survive is that nothing is lost: the same
# file scores against the path traced reference exactly as the glTF it came
# from does, to two decimals, in all five environments.
#
# The honest part is the second half. On this asset the format saves almost
# nothing, because converting `police.glb` is 77 ms and reading the result is
# 58 ms — a small mesh sampled densely is cheap to convert and the file is a
# hundred megabytes to read back. The saving would be real for an asset whose
# conversion is expensive; it is not real here, and the reason to keep the
# format is that a viewer needs something to open, not that it is faster.
[relight_quality.serialization]
format = "blade-volume/src/io/surfel.rs"
bytes_per_surfel = 32
psnr_from_gltf = 27.95
psnr_from_file = 27.95
tonemapped_from_gltf = 23.78
tonemapped_from_file = 23.78
# 3.75M surfels, 114.5 MB, the same asset at resolution 1600.
convert_seconds = 0.077
load_seconds = 0.058
# Decoding field by field first: making the read a straight copy into the
# tables halved it, which is the only thing that made it competitive at all.
load_seconds_before_bulk_read = 0.120

# The viewer's own path, which the offline tools do not exercise. Two defects
# were only visible here, and both would have shipped: the presentation blit
# sampled upside down, because blade renders with a flipped viewport while the
# tracer writes its first row at texture y = 0; and the camera's fly speed had
# a floor of one world unit, which is the whole length of a car.
#
# The blit failure is the same shape as every earlier one in this project:
# whichever number is not being checked is the one that moves. Colour was
# checked and was right; orientation was not checked and was wrong, through a
# full round of renders that read as an odd camera angle.
[relight_quality.viewer]
backend = "blade-volume-view/src/relight_render.rs"
checked_headless = "blade-volume-view/tests/relight_backend.rs"
# Prefiltering is per environment and blocks the frame it happens on. One
# second is a visible stall; it is kept because 256x128 is the resolution the
# scored configuration uses, and under-resolving a small bright source is
# worth several decibels. `--specular-size` trades it back.
prefilter_seconds_256x128 = 1.0
prefilter_threads = 12
prefilter_cached_on_return = true
environment_switch_after_prefilter = "two uploads, no rebuild of the acceleration structures"
# The window path does run. Checked on a virtual X server, which presents by
# software copy, so the frame rate below is a floor rather than a measurement
# of the renderer: 1100x760 with 235k surfels, direct lighting.
window_path_exercised = "Xvfb :99, NVIDIA ICD, captured with ffmpeg x11grab"
window_fps_floor = 130
window_swapchain_format = "B8G8R8A8_UNORM"
# Synthetic input through XTEST, since a bare X server assigns no focus and a
# key sent to it otherwise goes nowhere. Both interactive paths run: `L`
# cycles the light on a live window, and `W` moves at a tenth of the asset per
# press rather than the whole of it.
input_checked = [
  "L cycles environments",
  "W flies at the framed scale",
  "drag looks around",
  "resize: 1240x780, 420x300, 8x8, 1100x500",
]
# The debug build runs the Khronos validation layer, confirmed loaded through
# the loader's own log rather than assumed from a silent run. Two environment
# switches and two resizes — which destroy and recreate the specular array,
# the alias table and the HDR target under a running swapchain — produce no
# validation message at all.
validation_messages = 0
# Now a test rather than a session: `viewer_smoke` starts its own Xvfb, runs
# the shipped binary against it, and captures the window with XGetImage — no
# screenshot tool, nothing to install but Xvfb. Checked against a mutation:
# disabling the L handler fails it with "the most it moved was 0.000". It
# skips loudly without a GPU, an X server, or the X libraries, which is what
# CI has today.
smoke_test = "blade-volume-view/tests/viewer_smoke.rs"
smoke_test_seconds = 3.4

# Dragging found one more: the pitch was unclamped, so a drag of a few hundred
# pixels at 0.01 radians each went past vertical and left the world upside
# down, recoverable only by rolling with Q or E. It now stops two degrees short
# of the pole and keeps yawing. Nothing about this is specific to surfels — it
# has been true of every backend in this viewer.
[relight_quality.viewer.pitch]
was = "unclamped, inverts past vertical"
now = "stops at 88 degrees, yaw still applied"
drag_radians_per_pixel = 0.01

# Two more defaults were wrong in ways only a window shows. Framing at 1.4
# times the bounding sphere renders a small picture of a large empty frame,
# and a fixed exposure of one renders whichever environment happens to be in
# the right units. The exposure key is the log average rather than the mean,
# because every environment worth relighting under has a sun in it and an
# arithmetic mean halves the exposure for a source covering a thousandth of
# the sphere.
[relight_quality.viewer.defaults]
framing_margin_before = 1.4
framing_margin_after = 1.15
exposure_key = "log average luminance, solid angle weighted, aimed at 0.18"
exposure_studio = 4.76
exposure_sun_east = 1.51
# The procedural sun was also too weak to see when it moved: a tenth of this
# is still physical, but the nine-coefficient irradiance basis smooths a small
# source out and the difference between two sun positions arrived as a gentle
# gradient rather than as a light moving.
default_sun_radiance_before = 140.0
default_sun_radiance_after = 420.0
