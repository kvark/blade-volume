densify_schedule = "fixed"
densify_fraction = 0.15
densification_rounds = 3
color_loss = "l1"
max_steps = 256
far_plane = 100.0
background = "black"
opacity_weight = 1.0
distortion_weight = 0.0
quantile_weight = 0.0001
softplus_beta = 10.0
sampling_seed = "0xDEAD_BEEF_F00D_CAFE"
densification_seed = "0xCAFE_F00D_DEAD_BEEF"

[batch256]
pixel_batch = 256
completed_steps = 3000
total_steps = 20400
geometry_rebuild_every = 100
densify_every = 500
densify_warmup = 2000
densify_until = 11000

[batch1024]
pixel_batch = 1024
completed_steps = 750
total_steps = 5100
geometry_rebuild_every = 25
densify_every = 125
densify_warmup = 500
densify_until = 2750

[contribution]
views = 255
resolution_scale = 2
rays_per_round = 1044480
sampling_phase = "absolute densification round"

[execution]
