far_plane = 100.0
background = "black"
opacity_weight = 1.0
distortion_weight = 0.0
quantile_weight = 0.0001
softplus_beta = 10.0
sampling_seed = "0xDEAD_BEEF_F00D_CAFE"
densification_seed = "0xCAFE_F00D_DEAD_BEEF"

[batch256]
pixel_batch = 256
completed_steps = 3000
total_steps = 20400
geometry_rebuild_every = 100
densify_every = 500
densify_warmup = 2000
densify_until = 11000

[batch1024]
