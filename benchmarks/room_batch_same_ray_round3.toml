schema = 1
name = "room-radfoam-same-ray-batch-round3-v1"
purpose = "Test deterministic one-view and mixed-view optimizer batches on a second complete scene at matched sampled-ray boundaries"
dataset = "Mip-NeRF 360 / room"
dataset_path = "etc/data/room-full"
dataset_source = "https://huggingface.co/datasets/nvs-bench/mipnerf360"
dataset_revision = "2e0758f7f5d2bf82d5a29c795d3cbfb64af35474"
dataset_image_files = 311
colmap_registered_images = 311
comparison_scope = "matched 768000- and 1024000-ray boundaries, topology refreshes, growth rounds, contribution samples, and 128x128 fresh-Ply evaluation"

[split]
protocol = "existence-filtered COLMAP order, every Nth held out"
test_every = 8
max_train_views = 255
max_test_views = 8

[model]
backend = "radfoam"
initial_points = 50000
initialization = "radfoam-v1"
target_points = 200000
adjacency = "qhull-delaunay-exact"
sh_degree = 3
densify_fraction = 0.15
prune = true

[training]
width = 128
height = 128
sampled_rays = 768000
learning_rate = 0.1
lr_schedule = "cosine"
lr_min_ratio = 0.01
lr_groups = "legacy"
position_lr_ratio = 0.01
geometry_rebuild_schedule = "fixed"
densify_schedule = "fixed"
densify_fraction = 0.15
densification_rounds = 3
color_loss = "l1"
max_steps = 256
far_plane = 100.0
background = "black"
opacity_weight = 1.0
distortion_weight = 0.0
quantile_weight = 0.0001
softplus_beta = 10.0
sampling_seed = "0xDEAD_BEEF_F00D_CAFE"
densification_seed = "0xCAFE_F00D_DEAD_BEEF"

[batch256]
pixel_batch = 256
completed_steps = 3000
total_steps = 20400
geometry_rebuild_every = 100
densify_every = 500
densify_warmup = 2000
densify_until = 11000

[batch1024]
pixel_batch = 1024
completed_steps = 750
total_steps = 5100
geometry_rebuild_every = 25
densify_every = 125
densify_warmup = 500
densify_until = 2750

[contribution]
views = 255
resolution_scale = 2
rays_per_round = 1044480
sampling_phase = "absolute densification round"

