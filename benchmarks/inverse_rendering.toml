# The direct PBR Gaussian learns one view-independent sRGB radiance per final
# particle before it learns support. That is an attractive ownership signal:
# unlike projected-centre observations, it was optimized through the exact
# Gaussian mixture. Dividing it by measured sun-east irradiance, however,
# treats shadows, residual view dependence, and geometry compensation as
# albedo. Full transfer loses 0.82/0.80 dB. A 10% blend is indistinguishable
# from control and 25% loses 0.05/0.05 dB, so the signal has no gated material
# value even when used weakly. All candidates preserve the fitted F0 and
# roughness; only diffuse albedo changes.
#
# Nearest-authored-component substitutions explain why. On the final support,
# replacing only normals or materials with the nearest training-view truth
# makes held-light output worse, and moving centers to those nearest samples is
# worse again. These are deliberately diagnostics, not upper bounds: a nearest
# truth point is not a correspondence. Their failure proves that the fitted
# normals/materials compensate for particle ownership and center error, so
# independently making a component more truth-like is not a valid objective.
