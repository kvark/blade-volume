# Repeated captures under known lights make surface orientation identifiable
# without geometry or material truth. For every Gaussian, the solver searches
# 512 sphere directions, analytically eliminates one diffuse albedo per channel,
# and scores the shared residual across all non-held environments. `studio`
# remains unseen. Corrected normals make discs more edge-on, so the opt-in path
