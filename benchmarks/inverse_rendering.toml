# Posed photographs in, a relightable scene out.
#
# Two kinds of number live here and they are not interchangeable:
#
#   - **re-rendering**, how close the recovered scene comes to the images it
#     was built from. This is the goal, and it can be reached by cheating:
#     paint the illumination onto the surfaces and it goes up.
#   - **decomposition**, whether the material and the light are separately
#     anything. Only a capture whose answer is known can measure it, which is
#     what the `truth` section is.
#
# A run that reports only the first has not shown that anything was recovered.
#
# Reproduce with:
#   cargo build --release -p blade-volume-train --features qhull --bins
#   ./target/release/inverse_truth --views 24 --width 320 --height 240
#   ./target/release/reconstruct --sparse etc/data/bonsai-full/sparse/0 \
#       --images etc/data/bonsai-full/images --foam <trained.ply> \
#       --width 256 --stride 8 --test-every 8 \
#       --voxel-factor 4 --min-peak 0.05 --disc-radius 2.5 \
#       --min-views 2 --materials 0 --specular-rounds 0 \
#       --no-shadows --diffuse-samples 0

[manifest]
name = "inverse_rendering"
git_commit = "5ab418c"
gpu = "NVIDIA GeForce RTX 5070"
driver = "595.71.05"
cpu = "12th Gen Intel(R) Core(TM) i5-12400F"
profile = "release"

# ---------------------------------------------------------------- the truth

# A studio scene built for the purpose: four spheres on a floor in front of a
# wall, five diffuse albedos, under a sky with a sun in it. Photographed with
# 64 shadow rays, which buys shadowing and one bounce together; fitted with a
# model that has to earn both back.
#
# `police.glb` was tried first and is unusable for this: all nine of its
# materials are authored fully metallic, so `albedo = base * (1 - metallic)`
# is zero everywhere and there is no diffuse response to recover. The measured
# "0.0% albedo error" it produced was the error of comparing zero to zero.
[truth]
scene = "blade-volume-train/src/inverse/truth.rs::studio"
surfels = 92037
materials = 5
views = 24
size = "320x240"
capture_shadow_rays = 64

# What the model can express at all, with the real materials and the real
# light substituted in. No solver gets under this, and a solver that appears
# to is fitting the gap rather than the scene.
#
# The gap the shadowed number still carries is one bounce and a specular term
# the fit has no representation for.
[truth.forward_model_floor]
open_sky_error = 0.386
shadowed_error = 0.269

# The sweep across shared materials. Sharing was originally presented as what
# turns the fit into a decomposition; that was reading one column of three.
# Per-surfel albedo is the best albedo *and* the best re-rendering, and sharing
# only buys a better-shaped light. One material per surfel is now the default.
#
# Errors are what survives a per-channel gauge; the gauge itself is an
# assumption and is reported rather than folded in.
[[truth.sweep]]
materials = 1
albedo_error = 0.361
light_error = 0.896
psnr = 29.36

[[truth.sweep]]
materials = 16
albedo_error = 0.226
light_error = 0.311
psnr = 34.53

[[truth.sweep]]
materials = 256
albedo_error = 0.232
light_error = 0.346
psnr = 33.37

[[truth.sweep]]
materials = 4096
albedo_error = 0.328
light_error = 0.351
psnr = 32.20

# The degenerate end, kept because it is the control. The fit is nearly exact
# on the observations and the light is the worst of the sweep: with albedo
# free everywhere the product is under-determined and the illumination gets
# painted onto the surface.
[[truth.sweep]]
materials = 0
label = "one per surfel"
albedo_error = 0.227
light_error = 0.416
psnr = 34.98

# The truth scene's five materials are best matched by sixteen clusters, and
# the error rises on both sides of it. Too few and one albedo has to cover
# surfaces that differ; too many and each one sees too little of the sphere to
# constrain the light.
[truth.selection]
materials = 16
reason = "lowest albedo and light error; the scene has five materials"

# Shadowing without the bounce that fills it is worse than neither, measured
# rather than assumed. A patch the model says is fully shadowed is not black
# in any photograph, because whatever shadows it also lights it; with nowhere
# to put that light the fit puts it in the sky, which comes back wrong in
# shape and not merely in scale.
[truth.shadowing]
no_shadows_albedo_error = 0.294
no_shadows_light_error = 0.456
shadows_no_bounce_albedo_error = 0.291
shadows_no_bounce_light_error = 1.588
shadows_and_bounce_albedo_error = 0.232
shadows_and_bounce_light_error = 0.346
verdict = "shadowing pays only with the bounce; alone it is a large regression"

# An earlier version splatted every disc as its circumscribed circle, which is
# right only at normal incidence. At a grazing angle a disc covers a sliver,
# and the circle had every element occluding its own neighbours.
[truth.shadow_footprint]
circle_sky_open = 0.17
ellipse_sky_open = 0.30

# ------------------------------------------------------------------ the room

# Mip-NeRF 360 bonsai, 292 images, every eighth kept, every eighth of those
# held out. Geometry comes from a foam trained by this repo's own pipeline;
# the held-out views are excluded from the depth tracing as well as from the
# fit, or the test number would be measuring images it had already seen.
[bonsai]
dataset = "etc/data/bonsai-full"
views = 37
train_views = 33
test_views = 4
size = "256x170"
sparse_points = 206613

[bonsai.foam]
cells = 197906
train_psnr = 21.70
test_psnr = 20.01
wall_seconds = 1224.8
note = "the radiance field the geometry is extracted from; its quality caps everything downstream"

# Sparse COLMAP points, which need no training and cover only what COLMAP
# could triangulate.
[bonsai.geometry_sparse]
surfels = 169432
coverage = 0.443
train_psnr = 10.39
test_psnr = 10.00
psnr_where_hit = 14.85

# Depth fused from the trained foam. Four separate mistakes were made getting
# here; the first three cost about a decibel-decade each:
#
#   1. **Expected depth.** A field trained on photographs has long thin tails
#      and the mean sits out in them, so views agree about a surface and
#      disagree about where their tails end. Fusing means gave a shell dozens
#      of sheets thick: only 13% of surfels were ever the frontmost thing in
#      any view.
#   2. **No surface test.** A room's field is genuinely foggy — 100% of rays
#      reach full absorption — so mean, median and mode all return a confident
#      position for a ray that met nothing. Requiring one segment to carry a
#      minimum share of the absorption is the only available signal that
#      separates a wall from haze.
#   3. **Discs too small to meet.** At 0.75 of the merge cell they cannot tile
#      it, and every pixel came out part background. That reads as a uniformly
#      dark render rather than as visible holes.
#   4. **One-view layers.** Accepting a merge cell supported by only one depth
#      map retains view-specific density tails. Two-view consensus removes
#      nearly half the surfels without removing the measured surface.
[bonsai.geometry_foam]
surfels = 302070
voxel_factor = 4.0
disc_radius = 2.5
min_peak = 0.05
rays_meeting_a_surface = 1.0
train_coverage = 0.995
test_coverage = 0.617
# With 256 shared materials, which is what this was measured at before one
# material per surfel became the default. See `material.unseen_surfels` for
# the historical per-surfel numbers: 14.71 train, 10.25 test.
train_psnr = 14.01
test_psnr = 10.40
train_psnr_where_hit = 14.03
test_psnr_where_hit = 12.64

[bonsai.geometry_foam.depth_estimator]
expected_depth_surfels_seen = 0.13
median_depth_surfels_seen = 0.26
mode_depth_surfels_seen = 0.75
selection = "mode, with a minimum peak weight"

# Fresh Smooth-L1 source foam, evaluated with one material per surfel and the
# open-sky albedo-only protocol printed at the top of this file. The only
# control variable is how many distinct training cameras must contribute to a
# merge cell. Two is the selected boundary: it removes 48% of the cloud while
# retaining 98% of the surfels that were actually observed during fitting.
# Three begins losing both coverage and PSNR.
[bonsai.geometry_consensus]
git_commit = "141796b"
source_foam = "target/audit-runs/bonsai-fresh-batch4096-smooth-l1-step20400-local/model.ply"
source_foam_sha256 = "18481e5530c24d077f7612351ef8987dced52f6fe14867711d99980a17d515fa"
source_cells = 200000
voxel_factor = 4.0
disc_radius = 2.5
min_peak = 0.05
selection = "two views, then weight each depth sample by its peak absorption"

[bonsai.geometry_consensus.control]
min_views = 1
surfels = 71980
observed_surfels = 9477
train_psnr = 14.03
test_psnr = 13.34
train_coverage = 1.000
test_coverage = 0.989
test_psnr_where_hit = 13.51
wall_seconds = 5.197
peak_memory_bytes = 222879744

[bonsai.geometry_consensus.selected]
min_views = 2
surfels = 37217
observed_surfels = 9290
train_psnr = 14.30
test_psnr = 13.49
train_coverage = 0.993
test_coverage = 0.968
test_psnr_where_hit = 13.93
wall_seconds = 4.825
peak_memory_bytes = 186060800
artifact = "target/audit-runs/inverse-consensus-selected.rply"
artifact_sha256 = "d1e0d04a4f7210e0377394d523ebecdb72a7d211b4821fa07eb71f09957902da"
environment_sha256 = "70d8100f4fe93fb4c7fe3dd4c73ec07b81e0bd02c24bea688434a6e2be7aa390"

# A mode just above the haze threshold and a mode carrying most of its ray are
# not equally reliable depths. Using the already-computed peak absorption as
# the center/normal weight is a small but broad improvement with no new knob.
[bonsai.geometry_consensus.confidence_weighted]
git_commit = "5ab418c"
min_views = 2
surfels = 37217
observed_surfels = 9319
train_psnr = 14.34
test_psnr = 13.55
worst_test_psnr = 11.33
train_coverage = 0.993
test_coverage = 0.968
test_psnr_where_hit = 13.99
wall_seconds = 4.840
peak_memory_bytes = 204681216
artifact = "target/audit-runs/inverse-confidence-selected.rply"
artifact_sha256 = "6a1c8ea10a2bd4407bf78c4f9d504a171027626ec9b66138b303835432315459"
environment_sha256 = "9c45d2caa1e96f5763cb2ef6680dc9de2c86318a00afa1697cb91acd8ab33da0"

# The observer reads the pixel under every visible surfel centre, while the
# production renderer coverage-blends all nearby discs in its first surface
# band. The opt-in diagnostic added in `8045213` measures both centre claims
# and the observer's circular projected support approximation. It does not
# alter the observations or the selected reconstruction.
#
# Centre collisions are uncommon on the fused Bonsai geometry, but footprint
# overlap is not: every sampled pixel lies under many discs. The known-truth
# studio scene establishes that overlap by itself is expected for a watertight
# surfel surface, although Bonsai is an order of magnitude deeper. The shader's
# bounded hit window means the Bonsai support maximum is a geometry-density
# diagnostic, not a claim that all 114 discs are shaded.
[bonsai.observation_overlap]
git_commit = "8045213"
samples = 21187
sample_pixels = 20878
samples_sharing_center_pixel = 0.029
samples_with_multiple_projected_supports = 1.0
mean_projected_supports = 42.5
max_projected_supports = 114
unsupported_samples = 0

[bonsai.observation_overlap.truth_control]
samples = 384895
sample_pixels = 147371
samples_sharing_center_pixel = 0.946
samples_with_multiple_projected_supports = 0.987
mean_projected_supports = 3.3
max_projected_supports = 11
unsupported_samples = 543

# Weighting each observation by its circular coverage divided by total
# projected coverage is the simplest responsibility approximation. It is
# rejected: it slightly worsens both Bonsai splits, and on an analytic,
# true-light studio control it changes no albedo error while lowering the
# re-render score. The experimental switch and sample-weight plumbing were
# removed; only the diagnostic remains.
[bonsai.observation_overlap.rejected_responsibility]
control_train_psnr = 14.34
candidate_train_psnr = 14.30
control_test_psnr = 13.55
candidate_test_psnr = 13.53
truth_control_albedo_error = 0.324
truth_candidate_albedo_error = 0.324
truth_control_psnr = 39.08
truth_candidate_psnr = 38.70
verdict = "overlap is evidence for a better shared surface, not for scalar observation weights"

# Projection caching is decision-preserving and stays on the ordinary path;
# the deeper footprint scan is opt-in. Three alternating full commands on the
# selected protocol keep every quality number identical. The end-to-end gain
# is small because depth tracing, not observation, dominates this command.
[bonsai.observation_overlap.performance]
parent_commit = "93788e5"
control_wall_seconds = [4.92, 4.79, 4.76]
cached_wall_seconds = [4.79, 4.73, 4.70]
control_median_seconds = 4.79
cached_median_seconds = 4.73
diagnostics_observation_seconds = 0.7
ordinary_observation_seconds = 0.4
quality_changed = false

# Depth extraction dominated the selected command. Caching the camera terms
# shared by every pixel and tracing all training cameras through one scoped
# worker pool removes 33 short-lived per-image pools. Five alternating runs
# compare the parent binary against the candidate on the same machine. The
# reconstruction is decision-identical; the small RSS increase is the bounded
# cost of the pooled workers and their allocator high-water marks. The complete
# ten-run cgroup peaked at 171757568 charged bytes, with no swap, pressure, or
# OOM event.
[bonsai.depth_tracing.performance]
parent_commit = "b5f311a"
git_commit = "cfa1bba"
control_wall_seconds = [4.87, 4.77, 4.74, 4.77, 4.71]
batched_wall_seconds = [4.51, 4.49, 4.43, 4.48, 4.54]
control_median_seconds = 4.77
batched_median_seconds = 4.49
throughput_speedup = 1.062
control_median_max_rss_bytes = 352366592
batched_median_max_rss_bytes = 365891584
cgroup_peak_memory_bytes = 171757568
surfels = 37217
observed_surfels = 9319
train_psnr = 14.34
test_psnr = 13.55
worst_test_psnr = 11.33
quality_changed = false

[[bonsai.geometry_consensus.rejected]]
min_views = 3
surfels = 23047
train_psnr = 14.07
test_psnr = 13.08
train_coverage = 0.974
test_coverage = 0.920

[bonsai.geometry_consensus.shadowing]
control_sky_open = 0.23
selected_sky_open = 0.25
control_train_psnr = 13.75
selected_train_psnr = 14.17
control_test_psnr = 13.18
selected_test_psnr = 13.42
confidence_train_psnr = 14.20
confidence_test_psnr = 13.43
verdict = "consensus helps the relit path too, but open-sky remains better"

# On this scene shadowing is a regression, which is the opposite of what it is
# on the truth scene. The difference is the original geometry: a cloud fused
# from per-view depth is a scatter rather than a surface, it self-occludes to
# 13% of the sky, and occlusion computed against wrong geometry is worse than
# none. The consensus result above improves but does not reverse that verdict.
[bonsai.shadowing]
open_sky_train_psnr = 14.01
shadowed_train_psnr = 11.06
sky_open_fraction = 0.13
verdict = "shadowing pays only once the geometry is a surface"

# The honest summary. The re-rendering is far from the goal, and the reason is
# not the material/light split — that is measured on the truth scene and works.
# The fresh radiance field and two-view consensus close the old four-decibel
# train/test split, but 14 dB is still visibly a coarse set of fused depth
# layers rather than a faithful surface. The next geometry step must optimize
# one shared particle surface against the views, not add another polygonal
# intermediate.
[bonsai.status]
goal = "re-render the capture closely"
reached = false
train_psnr = 14.34
test_psnr = 13.55
limiting_stage = "geometry"
next = "optimize one shared oriented particle surface against all views"


# ------------------------------------------------- material beyond the albedo

# Observations are now kept per view rather than averaged. Averaging is lossless
# for a Lambertian albedo — a diffuse surface looks the same from everywhere —
# and fatal for anything else: roughness and reflectance are recoverable *only*
# from how one surfel changes between views.
[material]
observations = "per (surfel, view), CSR by surfel"
model = "albedo, roughness, F0 per surfel; metalness is an outcome, not a parameter"
hypotheses = "dielectric (F0 fixed at 0.04, albedo free) or metal (no diffuse term, F0 free)"
roughness = "chosen from the eight prefiltered levels by residual"

# The measurement that makes every roughness number readable: how much of each
# material's brightness the lobe actually accounts for, using the truth material
# and the truth light.
#
# A rough dielectric puts two to nine per cent of its brightness in the lobe.
# Nothing recovers a parameter that moves two per cent of the signal, and the
# solver correctly declines to try — the margin below leaves those surfaces at
# the default roughness rather than picking a level out of noise.
[[material.lobe_share]]
kind = "matte dielectric"
truth_roughness = 0.90
share = 0.02

[[material.lobe_share]]
kind = "glossy dielectric"
truth_roughness = 0.55
share = 0.07

[[material.lobe_share]]
kind = "glossy dielectric"
truth_roughness = 0.30
share = 0.09

[[material.lobe_share]]
kind = "glossy dielectric"
truth_roughness = 0.15
share = 0.06

[[material.lobe_share]]
kind = "metal"
truth_roughness = 0.25
share = 0.97

# Three corrections, measured with the real light handed to the fit so the sky's
# resolution is not a confound. The first two are mine; the third is the data's.
[material.corrections]
# A free two-by-two for albedo and F0 is close to collinear at four per cent
# lobe, so the solver split the difference and returned half-metals.
free_solve_albedo_error = 0.592
# Two physical hypotheses instead, each one unknown per channel.
two_hypotheses_albedo_error = 0.520
# The diffuse half knew about shadowing and the lobe did not. A metal sphere on
# a floor reflects that floor over much of its surface; a fit that thinks it is
# reflecting open sky over-predicts the lobe and rejects the metal hypothesis.
occluded_lobe_albedo_error = 0.357
albedo_only_baseline = 0.313

# What the margin is for. Below it the residuals of every hypothesis are within
# noise of each other, and calling a coin toss either way is worse than
# declining to call it: without one, about a third of a matte floor came back
# as metal, each of those surfels losing its albedo completely.
[material.margin]
value = 0.15
without_margin_floor_albedo = "0.46 0.45 0.42"
with_margin_floor_albedo = "0.64 0.63 0.60"
truth_floor_albedo = "0.72 0.70 0.66"

# The solver is correct in isolation: one sphere, one metal, the real light, and
# the renderer's own CPU shading for the photographs. It recovers the albedo,
# the reflectance and the roughness, and the assertion is a unit test.
#
# It does not recover the metal in the full studio scene, where the photographs
# carry a bounce the lobe path does not model and the orbit is at one elevation.
# That gap is the open item, not a solver defect.
[material.metal]
isolated_unit_test = "passes"
studio_recovered_albedo = "0.51 0.43 0.26"
studio_truth_albedo = "0.00 0.00 0.00"
status = "not yet recovered in the pipeline"

# Surfels nothing ever saw have no material of their own, and they still get
# drawn: the renderer averages every disc within a depth band, so an unlit-grey
# neighbour dilutes a surface that was measured. On bonsai seventy per cent of
# the geometry is buried, and this alone was the whole of the case for sharing
# materials.
#
# Copying the nearest measured surfel's material is local evidence rather than a
# scene-wide prior, and it makes one material per surfel the better default on
# both scenes.
[material.unseen_surfels]
bonsai_seen = 89073
bonsai_total = 302070
per_surfel_before_train_psnr = 11.03
per_surfel_before_test_psnr = 7.21
per_surfel_after_train_psnr = 14.71
per_surfel_after_test_psnr = 10.25
shared_256_train_psnr = 14.23
shared_256_test_psnr = 10.30
selection = "one material per surfel, filled from the nearest measured neighbour"

# Reflectance is reported as a mean absolute error on its own [0, 1] scale
# rather than relative to the truth. Most surfaces in any scene are dielectrics
# sitting at 0.04, so a relative measure divides by almost nothing: the first
# version of this reported 221 % for a fit whose dielectrics came back at 0.08,
# which is a real error and not a catastrophic one.
[material.reflectance]
metric = "mean absolute error"
dielectric_truth = 0.04
dielectric_recovered = 0.08
error = 0.07
