# the slowest block. A shared next-view counter keeps the existing fixed worker
# pool but balances those jobs as workers finish. Five alternating runs show a
# clear gain on the larger Room field and a neutral result on Bonsai. Results
# are restored to camera order, and the exact-depth-map regression test is
