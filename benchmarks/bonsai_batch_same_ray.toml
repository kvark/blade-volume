schema = 1
name = "bonsai-radfoam-same-ray-batch-v1"
purpose = "Compare batch 256 and 1024 after two growth rounds at the same sampled-ray budget"
dataset = "Mip-NeRF 360 / bonsai"
dataset_path = "etc/data/bonsai-full"
dataset_source = "https://huggingface.co/datasets/nvs-bench/mipnerf360"
dataset_revision = "2e0758f7f5d2bf82d5a29c795d3cbfb64af35474"
dataset_image_files = 292
colmap_registered_images = 292
comparison_scope = "same 640000 optimizer rays, 25 topology refreshes, two growth rounds, contribution samples, and 128x128 fresh-Ply evaluation"

[split]
protocol = "existence-filtered COLMAP order, every Nth held out"
test_every = 8
max_train_views = 255
max_test_views = 8

[model]
backend = "radfoam"
initial_points = 50000
initialization = "radfoam-v1"
target_points = 200000
adjacency = "qhull-delaunay-exact"
sh_degree = 3
densify_fraction = 0.15
prune = true

[training]
width = 128
height = 128
sampled_rays = 640000
learning_rate = 0.1
lr_schedule = "cosine"
lr_min_ratio = 0.01
lr_groups = "legacy"
position_lr_ratio = 0.01
geometry_rebuild_schedule = "fixed"
densify_schedule = "fixed"
densify_fraction = 0.15
densification_rounds = 2
color_loss = "l1"
max_steps = 256
far_plane = 100.0
background = "black"
opacity_weight = 1.0
distortion_weight = 0.0
quantile_weight = 0.0001
softplus_beta = 10.0
sampling_seed = "0xDEAD_BEEF_F00D_CAFE"
densification_seed = "0xCAFE_F00D_DEAD_BEEF"

[batch256]
pixel_batch = 256
completed_steps = 2500
total_steps = 20400
geometry_rebuild_every = 100
densify_every = 500
densify_warmup = 2000
densify_until = 11000
execution = "lossless 2000..2500 continuation of corrected fixed-cadence checkpoint"

[batch1024]
pixel_batch = 1024
completed_steps = 625
total_steps = 5100
geometry_rebuild_every = 25
densify_every = 125
densify_warmup = 500
densify_until = 2750
execution = "lossless 500..625 continuation of ray-normalized checkpoint"

[contribution]
views = 255
resolution_scale = 2
rays_per_round = 1044480
sampling_phase = "absolute densification round"

[execution]
release_binary_prebuilt = true
memory_max_bytes = 4294967296
memory_swap_max_bytes = 0

[result]
status = "completed"
required = ["git_commit", "gpu", "driver", "wall_seconds", "cells", "train_psnr", "test_psnr"]
