[package]
name = "blade-volume-view"
version = "0.1.0"
edition = "2021"
description = "Viewer utilities for blade-volume (camera control, input handling)"
license.workspace = true
repository.workspace = true

[dependencies]
blade-volume = { path = "../blade-volume" }
blade-graphics.workspace = true
blade-macros.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true
winit.workspace = true
argh.workspace = true
env_logger.workspace = true

# IMPORTANT:
# We must keep `egui`/`egui-winit` versions aligned with `blade-egui` to avoid
# `epaint::TexturesDelta` type mismatches (two different `epaint` versions).
#
# The `blade-egui` git dependency pins the compatible egui stack.
blade-egui = { git = "https://github.com/kvark/blade", rev = "bd74bdc82f870f8d7f02589de5f0fbb949b6e8a8", package = "blade-egui" }
egui = "0.34"
egui-winit = "0.34"

[dev-dependencies]
half.workspace = true

# Driving the real binary through a virtual X server: keys, drags, resizes and
# window capture, for the application paths an offscreen target cannot reach.
# Loaded at run time, so a machine without X skips the test rather than failing
# to build, and it never enters a shipped binary.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11-dl = "2"

[lints]
workspace = true
