[package]
name = "blade-volume-view"
version = "0.1.0"
edition = "2021"
description = "Viewer utilities for blade-volume (camera control, input handling)"
license.workspace = true
repository.workspace = true

[dependencies]
blade-volume = { path = "../blade-volume" }
blade-graphics.workspace = true
blade-macros.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true
winit.workspace = true
argh.workspace = true
env_logger.workspace = true

# IMPORTANT:
# We must keep `egui`/`egui-winit` versions aligned with `blade-egui` to avoid
# `epaint::TexturesDelta` type mismatches (two different `epaint` versions).
#
# The `blade-egui` git dependency pins the compatible egui stack.
blade-egui = { git = "https://github.com/kvark/blade", rev = "72c30c1", package = "blade-egui" }
egui = "0.34"
egui-winit = "0.34"

[dev-dependencies]
half.workspace = true

[lints]
workspace = true
